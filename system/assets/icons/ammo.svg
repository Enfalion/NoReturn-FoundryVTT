<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a6b24"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="tipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Dark tactical badge background -->
  <rect x="24" y="24" width="464" height="464" rx="64" fill="#141619" stroke="#3a4149" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="48" fill="none" stroke="#b8292f" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Left Cartridge -->
  <g transform="translate(88, 108)">
    <path d="M40 0 C22 28, 12 68, 12 104 L68 104 C68 68, 58 28, 40 0 Z" fill="url(#tipGrad)" stroke="#1e2227" stroke-width="6"/>
    <path d="M12 104 L8 134 L72 134 L68 104 Z" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="5"/>
    <rect x="8" y="134" width="64" height="156" rx="4" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="6"/>
    <rect x="4" y="290" width="72" height="16" rx="4" fill="url(#rimGrad)" stroke="#1e2227" stroke-width="5"/>
    <rect x="2" y="306" width="76" height="18" rx="4" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="5"/>
  </g>

  <!-- Center Cartridge (Elevated) -->
  <g transform="translate(216, 76)">
    <path d="M40 0 C22 30, 12 72, 12 110 L68 110 C68 72, 58 30, 40 0 Z" fill="url(#tipGrad)" stroke="#1e2227" stroke-width="6"/>
    <path d="M12 110 L8 142 L72 142 L68 110 Z" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="5"/>
    <rect x="8" y="142" width="64" height="172" rx="4" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="6"/>
    <rect x="4" y="314" width="72" height="16" rx="4" fill="url(#rimGrad)" stroke="#1e2227" stroke-width="5"/>
    <rect x="2" y="330" width="76" height="18" rx="4" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="5"/>
  </g>

  <!-- Right Cartridge -->
  <g transform="translate(344, 108)">
    <path d="M40 0 C22 28, 12 68, 12 104 L68 104 C68 68, 58 28, 40 0 Z" fill="url(#tipGrad)" stroke="#1e2227" stroke-width="6"/>
    <path d="M12 104 L8 134 L72 134 L68 104 Z" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="5"/>
    <rect x="8" y="134" width="64" height="156" rx="4" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="6"/>
    <rect x="4" y="290" width="72" height="16" rx="4" fill="url(#rimGrad)" stroke="#1e2227" stroke-width="5"/>
    <rect x="2" y="306" width="76" height="18" rx="4" fill="url(#casingGrad)" stroke="#1e2227" stroke-width="5"/>
  </g>
</svg>
